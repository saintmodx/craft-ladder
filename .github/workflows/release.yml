# A pushed tag (v1.2.3; with "alpha" or "beta" in it, that kind of release) packages the addon as .pkgmeta says and
# uploads it to CurseForge (the toc's X-Curse-Project-ID, WoW Forever's version from its Interface) and to GitHub
# Releases, with CHANGELOG.md as its changelog. CF_API_KEY: the CurseForge API token, a repo secret.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: the version comes from the tags
      # nothing goes out with "Unreleased" as its notes or the last version in the toc
      - name: The changelog and the toc have this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^## $v - " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v - <date>'"; exit 1; }
          grep -q "^## Version: $v" CraftLadder/CraftLadder.toc || { echo "the toc's Version isn't $v"; exit 1; }
      - uses: BigWigsMods/packager@v2
