# A pushed tag (v1.2.3; with "alpha" or "beta" in it, that kind of release) packages the addon as .pkgmeta says and
# uploads it to CurseForge (the toc's X-Curse-Project-ID, WoW Forever's version from its Interface) and to GitHub
# Releases, with the commits since the last tag as its changelog. CF_API_KEY: the CurseForge API token, a repo secret.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: the changelog and the version come from the tags
      - uses: BigWigsMods/packager@v2
